apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: week5-config
  namespace: week5
data:
  PORT: "8000"
  DB_HOST: "mysql-service"
  DB_NAME: "appdb"
  DB_USER: "appuser"